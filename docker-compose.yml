services:
  backend:
    container_name: gedasc-backend
    build:
      context: ./DataBase
    environment:
      - TZ=America/Bogota
    env_file:
      - ./DataBase/.env
    depends_on:
      - postgres
    networks:
      - gedasc-internal
      - proxy-network
    restart: always

  postgres:
    container_name: gedasc-postgres
    image: postgres:16
    environment:
      - TZ=America/Bogota
      - PGTZ=America/Bogota
    env_file:
      - ./DataBase/.env_postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DataBase/init_scripts:/docker-entrypoint-initdb.d
    networks:
      - gedasc-internal
    restart: always

  frontend:
    container_name: gedasc-frontend
    build:
      context: ./
      args:
        VITE_API_URL: https://api-gedasc.adsoproject.dev
    networks:
      - gedasc-internal
      - proxy-network
    restart: always

volumes:
  postgres_data:

networks:
  gedasc-internal:
    driver: bridge
  proxy-network:
    external: true
